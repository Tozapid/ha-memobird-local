[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "RUF",   # ruff-specific
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF012", # class-level lookup tables are never mutated
]

[tool.ruff.lint.isort]
# Home Assistant imports get a group of their own after third-party ones.
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.memobird_local"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "homeassistant",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant"]
