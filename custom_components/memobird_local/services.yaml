print:
  target:
    entity:
      integration: memobird_local
      domain: notify
  fields:
    message:
      required: true
      example: "Купить молоко"
      selector:
        text:
          multiline: true
    format:
      selector:
        select:
          options:
            - plain
            - markdown
            - html
          translation_key: format
    font_size:
      selector:
        number:
          min: 12
          max: 64
          step: 1
          unit_of_measurement: px
          mode: slider
    title:
      example: "Список покупок"
      selector:
        text:
    big:
      default: false
      selector:
        boolean:
    bold:
      default: false
      selector:
        boolean:
    underline:
      default: false
      selector:
        boolean:
    timestamp:
      default: true
      selector:
        boolean:
    separator:
      default: true
      selector:
        boolean:
print_image:
  target:
    entity:
      integration: memobird_local
      domain: notify
  fields:
    file:
      example: "/config/www/photo.jpg"
      selector:
        text:
    url:
      example: "https://example.com/image.png"
      selector:
        text:
          type: url
    camera:
      selector:
        entity:
          domain: camera
    svg:
      example: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="black" stroke-width="4"/></svg>'
      selector:
        text:
          multiline: true
    title:
      selector:
        text:
    caption:
      selector:
        text:
          multiline: true
    format:
      selector:
        select:
          options:
            - plain
            - markdown
            - html
          translation_key: format
    font_size:
      selector:
        number:
          min: 12
          max: 64
          step: 1
          unit_of_measurement: px
          mode: slider
    dither:
      default: true
      selector:
        boolean:
    timestamp:
      default: false
      selector:
        boolean:
    separator:
      default: true
      selector:
        boolean:
